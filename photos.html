<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | The Archive</title>
    <meta name="description" content="A photo gallery with a full-screen viewer. Swipe on mobile, use arrow keys on desktop.">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2300ffff' stroke-width='3'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="gallery-header">
        <h1>Selected works</h1>
        <p class="gallery-count" id="gallery-count" aria-live="polite"></p>
    </header>

    <main>
        <div class="gallery" id="gallery-container"></div>
    </main>

    <nav class="gallery-controls" aria-label="Gallery controls">
        <a href="index.html" class="btn-neon">Back</a>
        <button type="button" id="shuffle-btn" class="btn-neon">Shuffle</button>
    </nav>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
        <button type="button" class="lb-close" id="lb-close" aria-label="Close viewer">&times;</button>
        <button type="button" class="nav prev" aria-label="Previous photo">
            <svg width="60" height="60" viewBox="0 0 100 100" aria-hidden="true">
                <path d="M70 20 L30 50 L70 80" fill="none" stroke="#0ff" stroke-width="8" stroke-linecap="round"/>
                <circle cx="50" cy="50" r="45" stroke="#0ff" stroke-width="2" fill="none" class="pulse-ring"/>
            </svg>
        </button>

        <figure class="lb-figure">
            <img src="" alt="" id="lightbox-img">
            <figcaption id="lightbox-caption"></figcaption>
        </figure>

        <button type="button" class="nav next" aria-label="Next photo">
            <svg width="60" height="60" viewBox="0 0 100 100" aria-hidden="true">
                <path d="M30 20 L70 50 L30 80" fill="none" stroke="#0ff" stroke-width="8" stroke-linecap="round"/>
                <circle cx="50" cy="50" r="45" stroke="#0ff" stroke-width="2" fill="none" class="pulse-ring"/>
            </svg>
        </button>
    </div>

    <script src="photos-data.js"></script>
    <script src="gallery.js"></script>
</body>
</html>
